
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

*{

    padding:0;

.contenedor{

    text-align:center;
    width:90%;
    max-width:600px;

h1{
    color:#0f172a;
    margin-bottom:15px;
}

p{

.boton{

    background:#0ea5e9;

    padding:14px 30px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;

.boton:hover{

    transform:translateY(-3px);

</head>
