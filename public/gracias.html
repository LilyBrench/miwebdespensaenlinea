

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gracias por contactarnos</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background: linear-gradient(
        135deg,
        #14d8e6,
        #6edb8f,
        #d6dd31
    );
}

.contenedor{
    background:white;
    width:90%;
    max-width:600px;
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.20);
}

.icono{
    font-size:70px;
    margin-bottom:20px;
}

h1{
    color:#003b8e;
    margin-bottom:20px;
    font-size:38px;
}

p{
    color:#444;
    font-size:20px;
    line-height:1.6;
    margin-bottom:30px;
}

.boton{
    display:inline-block;
    background:linear-gradient(
        90deg,
        #14d8e6,
        #6edb8f,
        #d6dd31
    );

    color:#003b8e;
    font-weight:bold;
    text-decoration:none;
    padding:15px 35px;
    border-radius:12px;
    font-size:18px;
    transition:.3s;
}

.boton:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 15px rgba(0,0,0,.25);
}

</style>
</head>

<body>

<div class="contenedor">

    <div class="icono">✅</div>

    <h1>¡Mensaje enviado!</h1>

    <p>
        Gracias por contactar con <strong>Despensa en Línea</strong>.
        Hemos recibido correctamente tu información y nos pondremos en contacto contigo lo antes posible.
    </p>

    <a href="/https://miwebdespensaenlinea.netlify.app/" class="boton">
        Volver al sitio
    </a>

</div>

</body>
</html>
