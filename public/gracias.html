

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mensaje enviado</title>

<style>

body{
    margin:0;
    padding:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        90deg,
        #14d8e6,
        #71dc8a,
        #d9dd2a
    );
}

.contenedor{
    background: rgba(255,255,255,0.95);
    padding:40px;
    border-radius:20px;
    text-align:center;
    max-width:500px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h1{
    color:#004aad;
    margin-bottom:15px;
}

p{
    color:#333;
    font-size:18px;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:12px 25px;
    text-decoration:none;
    font-weight:bold;
    color:white;
    border-radius:10px;

    background: linear-gradient(
        90deg,
        #14d8e6,
        #71dc8a,
        #d9dd2a
    );
}

a:hover{
    opacity:0.9;
}

</style>
</head>

<body>

<div class="contenedor">

    <h1>✅ ¡Gracias por contactarnos!</h1>

    <p>
        Hemos recibido tu mensaje correctamente.
        Nos pondremos en contacto contigo lo antes posible.
    </p>

    <a href="/https://miwebdespensaenlinea.netlify.app/">
        Volver al sitio web
    </a>

</div>

</body>
</html>
